client_body_timeout 300;
client_header_timeout 300;
keepalive_timeout 300;
proxy_connect_timeout 300;
proxy_read_timeout 300;
proxy_send_timeout 300;

# Max upload size for product images, etc.
client_max_body_size 64m;

# ---------- Performance: gzip compression ----------
# Reduces bandwidth for 10k+ stores — critical for scale
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-javascript
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/opentype
    font/otf
    image/bmp
    image/svg+xml
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/markdown
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy
    text/xml;

# ---------- Security headers ----------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

index index.php index.html index.htm;

# ---------- Health check endpoint (for load balancers / monitoring) ----------
location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"plugn"}';
}

# Yii-specific configuration
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ---------- Static asset caching ----------
# Cache JS/CSS/fonts/images for 30 days — reduces origin requests for 10k stores
location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|webp|avif|mp4|webm|pdf|swf|mov|fla|zip|rar)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Deny access to config directory
location ~ ^/(apache-config|frontend|k8s|store|runtime|vendor|environments|docker-entrypoint-initdb.d|cron|console|common|backup|\.circleci)/ {
    deny all;
    return 403;
}

location ~ /\.(env|git|htaccess|htpasswd|sh) {
    deny all;
    return 403;
}

location ~* \.(env|git|htaccess|htpasswd|sh)$ {
    deny all;
}

# Deny direct access to .php files in /environments
location ~ ^/environments/.*\.php$ {
    deny all;
    return 403;
}

# Deny direct access to .php files in /assets
location ~ ^/assets/.*\.php$ {
    deny all;
    return 403;
}

# PHP handling
location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    
    # Add these timeout settings
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_connect_timeout 300;
    
    # Add Railway-specific headers
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    #fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
    #fastcgi_param HTTPS $https if_not_empty;
}

# Deny access to hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}