version: '3.8'

networks:
  plugn-dev-network:
    driver: bridge

services:
  
  mysql:
    image: mysql:8.4.3
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=plugn
      - MYSQL_DATABASE=plugn
      - MYSQL_USER=plugnuser
      - MYSQL_PASSWORD=plugn
    ports:
      - "3307:3306"
    networks:
      - plugn-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uplugnuser", "-pplugn"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  #composer_installation:
  #  container_name: composer_installation
  #  image: composer
  #  volumes:
  #    - .:/home/ubuntu/plugn
 #   command: composer install 
    
  app:
    build: 
      context: .
      dockerfile: ./Dockerfile-nginx-local
    container_name: plugn-backend-dev
    ports:
      - "8080:8080" # backend
      - "8081:8081" # agent
      - "8082:8082" # api
      - "8083:8083" # crm
      - "8084:8084" # frontend
      - "8085:8085" # partner
      - "8086:8086" # shortner
      - "8087:8087" # remail
    volumes:
      - .:/home/ubuntu/plugn
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=plugn
      - MYSQL_USER=plugnuser
      - MYSQL_PASSWORD=plugn
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - plugn-dev-network

  redis:
    image: redis:6.2.3
    ports:
      - "6379:6379"
    networks:
      - plugn-dev-network
   # command:
   #   - redis-server --port 7777
    volumes:
    - redis-data:/data

volumes:
  redis-data:
  mysql-data: 

