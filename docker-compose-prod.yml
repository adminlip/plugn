version: '3.8'

networks:
  plugn-network:
    driver: bridge

services:
   
  app:
    build: 
      context: .
      dockerfile: ./Dockerfile-nginx-prod
    container_name: plugn-backend-prod
    command:
      - /bin/sh
      - -c
      - |
        sleep 10 && \
        ./init --env=Production-Docker --overwrite=All && \
        ./yii migrate --interactive=0 && \
        sleep 1 && \
        service nginx restart  && \
        tail -f /dev/null  # Keep container running
    ports:
      - "80:80" #app endpoint
    volumes:
      - .:/home/ubuntu/plugn
      - ./nginx/production.conf:/etc/nginx/sites-available/production.conf
    depends_on:
      - redis
      - mysql
    networks:
      - plugn-network

  mysql:
    image: mysql:8.0
    container_name: plugn-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plugn}
      MYSQL_USER: ${MYSQL_USER:-plugn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-plugn_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - plugn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2.3
    ports:
      - "6379:6379"
    networks:
      - plugn-network
    volumes:
    - redis-data:/data

volumes:
  redis-data:
  mysql-data:
  